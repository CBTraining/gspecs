<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // Your shortlinks: gspecs.app/go?key
    const links = {
      "promos": "https://gpromos.glide.app"
    };

    // Grabs "promos" from "gspecs.app/go?promos" (case-insensitive)
    const key = window.location.search.substring(1).toLowerCase();

    if (links[key]) {
      window.location.replace(links[key]);
    } else {
      window.location.replace("https://gspecs.app");
    }
  </script>
</head>
<body style="background-color: #121212; color: #ffffff; font-family: sans-serif; text-align: center; padding-top: 20vh;">
  <p>Redirecting...</p>
</body>
</html>
